# Disallow :latest and Untagged Images  (severity: high, rollout: recommended)
# Ships in Audit mode. Switch to Deny with: kubectl apply -k overlays/enforce
# Tests: policies/disallow-latest-tag/.kyverno-test/
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  labels:
    app.kubernetes.io/part-of: ftw-k8s-hardening
    ftw.io/enforce: recommended
  annotations:
    policies.kyverno.io/title: Disallow :latest and Untagged Images
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.0
    ftw.io/benchmark-cis: 5.7 General Policies (image provenance); see also 'Image Provenance' supply-chain
      controls
    ftw.io/benchmark-nsa-cisa: Upgrading and application security practices - immutable, versioned images
    ftw.io/rollout: Audit >= 7 days -> fix PolicyReport violations -> Warn -> Deny
    policies.kyverno.io/description: >-
      ':latest' and untagged images are mutable: rollbacks, audits and cache behaviour become unpredictable.
      Every image must carry an explicit non-latest tag or a digest.
spec:
  validationActions:
  - Audit
  autogen:
    podControllers:
      controllers:
      - deployments
      - statefulsets
      - daemonsets
      - jobs
      - cronjobs
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - kube-system
        - kube-public
        - kube-node-lease
        - kyverno
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: >-
      object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: >-
      variables.allContainers.all(c, c.image.contains('@') || (c.image.substring(c.image.lastIndexOf('/')
      + 1).contains(':') && !c.image.endsWith(':latest')))
    message: >-
      Images must use an explicit version tag or digest; ':latest' and untagged images are not allowed.
