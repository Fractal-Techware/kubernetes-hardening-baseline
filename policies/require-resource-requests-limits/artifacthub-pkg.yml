readme: |
  # Require CPU/Memory Requests and Memory Limits

  Every container and initContainer must declare cpu and memory requests and a memory limit. Unbounded memory lets one pod starve a node. CPU limits are intentionally optional (they cause throttling); add 'cpu' to requiredLimits to require them.

  - Severity: **medium**
  - Engine: Kyverno 1.19+ `ValidatingPolicy` (CEL), autogen for Deployments, StatefulSets, DaemonSets, Jobs and CronJobs
  - Mode: ships in **Audit** (report only). Switch to Deny after reviewing PolicyReports.
  - Tested: passing and failing resources under `.kyverno-test/`, run with `kyverno test`.

  Part of the free [Kubernetes Hardening Baseline](https://github.com/Fractal-Techware/kubernetes-hardening-baseline) by Fractal Techware.
